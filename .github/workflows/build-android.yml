name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (misal: v0.0.4)'
        required: false
        default: 'v0.0.4'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Gaul FM v0.0.4 (Development Build)'
      prerelease:
        description: 'Tandai sebagai Pre-release?'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Release Standalone)
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: http://40.81.231.250:3001
      EXPO_PUBLIC_STREAM_URL: http://27.50.19.173:9000/gaulfm.m3u
      EXPO_PUBLIC_VISUAL_STREAM_RTMP_URL: rtmp://40.81.231.250:1935/gaulfm_webrtc
      EXPO_PUBLIC_VISUAL_STREAM_WHEP_URL: http://40.81.231.250:8889/gaulfm_webrtc/whep
      EXPO_PUBLIC_VISUAL_STREAM_HLS_URL: http://40.81.231.250:8888/gaulfm_webrtc/index.m3u8

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install Mobile Dependencies & Apply Patches
        working-directory: mobile
        run: |
          npm install
          npx patch-package

      - name: ⚙️ Generate Android Native Project (Expo Prebuild)
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install
          node -e '
          const fs = require("fs");
          const file = "android/app/build.gradle";
          let content = fs.readFileSync(file, "utf8");
          if (!content.includes("splits {")) {
            content = content.replace(/android\s*\{/, "android {\\n    splits {\\n        abi {\\n            reset()\\n            enable true\\n            universalApk true\\n            include \"armeabi-v7a\", \"arm64-v8a\", \"x86\", \"x86_64\"\\n        }\\n    }");
            fs.writeFileSync(file, content, "utf8");
            console.log("Injected ABI splits into build.gradle successfully");
          } else {
            console.log("ABI splits already present in build.gradle");
          }
          '

      - name: 🔨 Build Android APK (Release Standalone)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📦 Prepare APK Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.4' }}"
          echo "Memeriksa seluruh file APK hasil build release:"
          find mobile/android/app/build/outputs/apk/release -type f -name "*.apk"
          
          for apk in mobile/android/app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" "release-artifacts/GaulFM-${TAG}-arm64-v8a.apk"
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" "release-artifacts/GaulFM-${TAG}-armeabi-v7a.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" "release-artifacts/GaulFM-${TAG}-x86_64.apk"
            elif [[ "$filename" == *"x86"* ]]; then
              cp "$apk" "release-artifacts/GaulFM-${TAG}-x86.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" "release-artifacts/GaulFM-${TAG}-universal.apk"
            else
              cp "$apk" "release-artifacts/GaulFM-${TAG}-${filename}"
            fi
          done

          echo "Daftar APK siap rilis:"
          ls -lh release-artifacts/

      - name: 📤 Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaulfm-android-release-apks
          path: release-artifacts/*.apk
          retention-days: 14

      - name: 🚀 Publish APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.0.4' }}"
          TITLE="${{ github.event.inputs.release_title || 'Gaul FM v0.0.4 (Development Build)' }}"
          
          echo "Menyiapkan rilis GitHub untuk tag: $TAG..."
          
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG sudah ada. Mengunggah/memperbarui aset APK..."
            gh release upload "$TAG" release-artifacts/*.apk --clobber
          else
            echo "Membuat GitHub Release baru untuk tag $TAG..."
            gh release create "$TAG" release-artifacts/*.apk \
              --title "$TITLE" \
              --notes "### 📻 Gaul FM Semarang - Android Release ($TAG)
              
- **Versi**: 0.0.4
- **Platform**: Android Standalone APK (Split ABI Per Arsitektur)
- **Arsitektur**: React Native New Architecture + Expo SDK 54
- **Optimasi Ukuran**: APK dipisah berdasarkan arsitektur CPU sehingga ukuran unduhan menjadi jauh lebih ringan (~15–25 MB vs ~70 MB).

#### 📦 Pilihan File APK:
1. **\`GaulFM-${TAG}-arm64-v8a.apk\` (Sangat Direkomendasikan)**: Untuk 90%+ smartphone Android modern (64-bit ARM). Ukuran paling ringan dan performa paling optimal.
2. **\`GaulFM-${TAG}-armeabi-v7a.apk\`**: Untuk smartphone Android 32-bit (perangkat tipe lama atau entry level).
3. **\`GaulFM-${TAG}-universal.apk\`**: Varian universal (mencakup semua arsitektur, bisa diinstal di perangkat apa saja).
4. **\`GaulFM-${TAG}-x86.apk\` / \`GaulFM-${TAG}-x86_64.apk\`**: Khusus untuk emulator PC/Laptop Android, Chromebook, atau perangkat berprosesor Intel/AMD.

#### 🚀 Fitur & Pembaruan v0.0.4:
- **Master Data Jadwal & Deskripsi Resmi**: Sinkronisasi info program baku (Gaul Morning Show, Gaul Waktu Setempat, Asupan Gaul) lengkap dengan jam siaran (WIB), hari tayang, dan deskripsi acara resmi.
- **Karusel Gaul Squad di Player**: Integrasi daftar profil penyiar Gaul FM interaktif di dalam lembar pemutar (*LiveDetailSheet*).
- **Home Up Next yang Disempurnakan**: Visual poster program resmi, badge waktu WIB dinamis, dan akses cepat ke detail siaran.
- **Aksi Cepat Nonton Radio**: Tombol studio visual interaktif di Beranda dengan dukungan langsung mode fullscreen chat.
- **Perbaikan Alur Navigasi**: Transisi kembali dari detail program langsung menuju daftar jadwal secara konsisten.
- **Pemisahan Binary APK (Split ABI)**: Mengurangi ukuran file aplikasi secara drastis untuk efisiensi kuota pendengar." \
              --prerelease
          fi
